spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/forge
spring.datasource.username=root
spring.datasource.password=Aditya@123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
forge.jwt.secret=${FORGE_JWT_SECRET}
forge.jwt.access-token-expiration=900000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${FORGE_MAIL_USERNAME}
spring.mail.password=${FORGE_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.security=DEBUG

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB